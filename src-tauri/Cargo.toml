[package]
name = "prime-desktop-host"
version = "0.1.1"
description = "Prime Desktop: the React renderer in a Tauri v2 host, on the Rust Prime Agent"
edition = "2024"
publish = false

[lib]
name = "prime_desktop_host_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
desktop-core = { path = "crates/core" }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[workspace]
members = ["crates/core"]

# pa-tui calls `crossterm::event::poll_opt`, which exists only in the crossterm copy Prime Agent vendors (it caps a
# slow terminal query). Take that copy from the same tag.
[patch.crates-io]
crossterm = { git = "https://github.com/PrimeIntellect-ai/prime-agent", tag = "v0.10.0" }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
