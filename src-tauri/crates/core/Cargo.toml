[package]
name = "desktop-core"
version = "0.1.1"
description = "Prime Desktop application logic: state, git, files, terminal, the Prime Agent link and the sandbox wiring. No Tauri here, so it is tested headless."
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "process"] }
sha2 = "0.10"
hex = "0.4"
ureq = "3"
flate2 = "1"
tar = "0.4"
url = "2"
base64 = "0.22"
regex = "1"
ignore = "0.4"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9"
# Prime Agent's own wire types and daemon client, pinned to the release the app installs. Nothing about the daemon
# protocol is rewritten here.
pa-types = { git = "https://github.com/PrimeIntellect-ai/prime-agent", tag = "v0.10.0" }
pa-tui = { git = "https://github.com/PrimeIntellect-ai/prime-agent", tag = "v0.10.0" }

[dev-dependencies]
tempfile = "3"
