name: Tauri

# The Tauri app on a real machine of each target system: the renderer's checks, the Rust suites, and an installer built
# unsigned (signing is done by whoever releases). The release workflow calls this one and publishes what it builds.
# Runner images: https://github.com/actions/runner-images (macOS 26 is the newest; Windows Server 2025 is the newest
# Windows image; Ubuntu 24.04 is kept on purpose, see the note on the matrix).

on:
  push:
    branches: [main]
    paths: ['src/**', 'src-tauri/**', 'sandbox/**', 'scripts/**', 'tests/**', 'package*.json', '.github/workflows/tauri.yml']
  pull_request:
    paths: ['src/**', 'src-tauri/**', 'sandbox/**', 'scripts/**', 'tests/**', 'package*.json', '.github/workflows/tauri.yml']
  workflow_call:

concurrency:
  group: tauri-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest Ubuntu we support: a .deb built on a newer one needs that newer glibc.
          - { name: linux-x64, os: ubuntu-24.04, bundles: deb }
          - { name: macos-arm64, os: macos-26, bundles: dmg }
          - { name: macos-x64, os: macos-26-intel, bundles: dmg }
          - { name: windows-x64, os: windows-2025, bundles: nsis }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # src-tauri/rust-toolchain.toml pins the toolchain and its components; the sandbox workspace has no pin, so it
      # uses this one.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            sandbox

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf bubblewrap

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Renderer build
        run: npm run build

      # The host builds against the staged renderer, so stage it before any cargo command in src-tauri.
      - name: Stage the renderer
        run: node scripts/tauri-stage.mjs

      - name: Sandbox suite
        working-directory: sandbox
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Rust suite
        working-directory: src-tauri
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Build the sidecars
        run: |
          cargo build --release --locked --manifest-path sandbox/Cargo.toml -p desktop-sandbox -p desktop-sandbox-probes
          node scripts/tauri-sidecars.mjs
          node scripts/tauri-agent.mjs

      - name: Unsigned installer
        run: |
          cargo install tauri-cli --version '^2' --locked
          cd src-tauri
          cargo tauri build --bundles ${{ matrix.bundles }} --config tauri.sidecars.conf.json

      - uses: actions/upload-artifact@v4
        with:
          name: prime-desktop-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: error
