name: Release

# Push a tag like v0.2.0 (see `npm run release`) to build Prime Desktop for Windows, macOS and Linux and publish it as a
# GitHub release. The notes are the CHANGELOG section for that version, and the tag must match the version in every file
# that carries it, so a release cannot go out with the wrong number or without notes.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  notes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the tag and write the notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  build:
    needs: notes
    uses: ./.github/workflows/tauri.yml

  publish:
    needs: [notes, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Prime Desktop ${GITHUB_REF_NAME#v}" --notes-file dist/release-notes/release-notes.md \
            --verify-tag "${prerelease[@]}" $(find dist -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' \))
